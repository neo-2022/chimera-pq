name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  github-latest:
    name: Build and Publish GitHub Latest Assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: release
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          CHIMERA_RELEASE_GPG_PUBLIC_KEY: ${{ secrets.CHIMERA_RELEASE_GPG_PUBLIC_KEY }}
          CHIMERA_RELEASE_GPG_FINGERPRINT: ${{ vars.CHIMERA_RELEASE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${INPUT_RELEASE_TAG:-}"
            if [[ -z "$release_tag" ]]; then
              echo "error: workflow_dispatch requires release_tag" >&2
              exit 1
            fi
          fi
          # actions/checkout on tag pushes can leave refs/tags/<tag> as a
          # commit-only ref in the runner clone. Refetch the remote tag object
          # explicitly before signature verification.
          git fetch --tags --force origin
          git rev-parse -q --verify "refs/tags/${release_tag}^{tag}" >/dev/null || {
            echo "error: annotated signed release tag is required: ${release_tag}" >&2
            exit 1
          }
          git checkout -q "refs/tags/${release_tag}"
          if [[ -z "${CHIMERA_RELEASE_GPG_PUBLIC_KEY:-}" ]]; then
            echo "error: CHIMERA_RELEASE_GPG_PUBLIC_KEY secret is required for signed release tags" >&2
            exit 1
          fi
          if [[ -z "${CHIMERA_RELEASE_GPG_FINGERPRINT:-}" ]]; then
            echo "error: CHIMERA_RELEASE_GPG_FINGERPRINT repository variable is required for signed release tags" >&2
            exit 1
          fi
          printf '%s\n' "$CHIMERA_RELEASE_GPG_PUBLIC_KEY" | gpg --batch --import >/dev/null 2>&1
          verify_log="$(mktemp)"
          if ! git verify-tag --raw -v "${release_tag}" >"$verify_log" 2>&1; then
            echo "error: release tag GPG verification failed: ${release_tag}" >&2
            exit 1
          fi
          signer_fingerprint="$(awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print toupper($3); exit }' "$verify_log")"
          expected_fingerprint="$(printf '%s' "$CHIMERA_RELEASE_GPG_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$signer_fingerprint" || "$signer_fingerprint" != "$expected_fingerprint" ]]; then
            echo "error: release tag signer fingerprint mismatch" >&2
            exit 1
          fi
          release_version="${release_tag#v}"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Release Gate Tools
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already installed: $(command -v rg)"
            exit 0
          fi
          sudo apt-get update || echo "warning: apt-get update failed, continuing"
          sudo apt-get install -y ripgrep || echo "warning: apt-get install ripgrep failed"
          command -v rg >/dev/null 2>&1

      - name: Installer Contract Gate
        run: |
          bash -n scripts/product_language_guard.sh
          bash scripts/product_language_guard.sh
          bash scripts/chimera_installer_gate.sh
          bash scripts/chimera_update_contract_smoke.sh
          bash scripts/chimera_start_contract_smoke.sh
          bash scripts/chimera_stop_contract_smoke.sh
          bash scripts/chimera_doctor_contract_smoke.sh
          bash scripts/chimera_runner_sudo_contract_smoke.sh

      - name: Build Release Bundle
        env:
          CHIMERA_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/build_release.sh

      - name: Release Bundle Install Contract
        run: bash scripts/release_bundle_install_contract_smoke.sh

      - name: Verify Release Assets
        shell: bash
        run: |
          set -euo pipefail
          test -s target/chimera.sh
          test -s target/chimera-pq-release.tar.gz
          test -s target/chimera-pq-release.tar.gz.sha256
          grep -q '^VERSION="' target/chimera.sh
          grep -q '^ARCHIVE_URL_DEFAULT="https://github.com/neo-2022/chimera-pq/releases/latest/download/chimera-pq-release\.tar\.gz"' target/chimera.sh
          grep -q '^CHECKSUM_URL_DEFAULT="https://github.com/neo-2022/chimera-pq/releases/latest/download/chimera-pq-release\.tar\.gz\.sha256"' target/chimera.sh
          (cd target && sha256sum -c chimera-pq-release.tar.gz.sha256)
          tar -tzf target/chimera-pq-release.tar.gz > target/chimera-release-contents.txt
          grep -q '^chimera-release/bin/chimera-cli$' target/chimera-release-contents.txt
          grep -q '^chimera-release/bin/chimera-node$' target/chimera-release-contents.txt
          grep -q '^chimera-release/bin/chimera-bootstrap$' target/chimera-release-contents.txt
          grep -q '^chimera-release/bin/chimera-peer-egress$' target/chimera-release-contents.txt
          grep -q '^chimera-release/scripts/chimera-control\.sh$' target/chimera-release-contents.txt
          grep -q '^chimera-release/scripts/chimera-runner\.sh$' target/chimera-release-contents.txt
          grep -q '^chimera-release/scripts/install_release\.sh$' target/chimera-release-contents.txt
          grep -q '^chimera-release/scripts/chimera.sh$' target/chimera-release-contents.txt
          grep -q '^chimera-release/scripts/chimera-sh$' target/chimera-release-contents.txt
          grep -q '^chimera-release/scripts/chimera-update.sh$' target/chimera-release-contents.txt
          grep -q '^chimera-release/scripts/chimera-update-runtime-state\.sh$' target/chimera-release-contents.txt
          grep -q '^chimera-release/scripts/chimera-update-rerun\.sh$' target/chimera-release-contents.txt
          grep -q '^chimera-release/scripts/mesh_control_plane_env_from_preflight\.sh$' target/chimera-release-contents.txt
          grep -q '^chimera-release/configs/mesh_bootstrap\.env\.example$' target/chimera-release-contents.txt
          grep -q '^chimera-release/configs/mesh-node\.example\.conf$' target/chimera-release-contents.txt
          grep -q '^chimera-release/configs/update_gitvers_bootstrap_urls\.example\.list$' target/chimera-release-contents.txt
          grep -q '^chimera-release/deploy/systemd-user/chimera-node\.service$' target/chimera-release-contents.txt
          grep -q '^chimera-release/deploy/systemd-user/chimera-datapath\.service$' target/chimera-release-contents.txt
          ! grep -q '^chimera-release/bin/chimera-gateway$' target/chimera-release-contents.txt
          ! grep -q '^chimera-release/configs/upstream_proxy\.env\.example$' target/chimera-release-contents.txt
          ! grep -q '^chimera-release/configs/client\.example\.conf$' target/chimera-release-contents.txt
          ! grep -q '^chimera-release/configs/gateway\.example\.conf$' target/chimera-release-contents.txt
          ! grep -q '^chimera-release/deploy/systemd-user/chimera-client\.service$' target/chimera-release-contents.txt
          ! grep -q '^chimera-release/deploy/systemd-user/chimera-gateway\.service$' target/chimera-release-contents.txt
          ! grep -q '^chimera-release/configs/policy\.runtime\.conf$' target/chimera-release-contents.txt
          ! grep -q '^chimera-release/configs/chimera-app-routes\.conf$' target/chimera-release-contents.txt
          ! grep -q '^chimera-release/configs/chimera-app-routes\.example\.conf$' target/chimera-release-contents.txt
          ! grep -q '^chimera-release/configs/mesh_launch_preflight\.side_[ab]\.env\.example$' target/chimera-release-contents.txt
          ! grep -q '^chimera-release/scripts/chimera_runtime_bootstrap\.sh$' target/chimera-release-contents.txt

      - name: Publish GitHub Release Latest Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cat > target/release-notes.md <<EOF
          CHIMERA-PQ ${RELEASE_TAG}

          Required one-command install assets:
          - chimera.sh
          - chimera-pq-release.tar.gz
          - chimera-pq-release.tar.gz.sha256
          EOF

          required_assets=(
            "chimera.sh"
            "chimera-pq-release.tar.gz"
            "chimera-pq-release.tar.gz.sha256"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "error: release already exists and immutable release policy forbids asset replacement: ${RELEASE_TAG}" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            target/chimera.sh \
            target/chimera-pq-release.tar.gz \
            target/chimera-pq-release.tar.gz.sha256 \
            --verify-tag \
            --latest \
            --title "$RELEASE_TAG" \
            --notes-file target/release-notes.md

      - name: Verify GitHub Latest Contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release view --json tagName --jq '.tagName')"
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "error: releases/latest points to ${latest_tag}, expected ${RELEASE_TAG}" >&2
            exit 1
          fi

          expected="$(printf '%s\n' chimera-pq-release.tar.gz chimera-pq-release.tar.gz.sha256 chimera.sh)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "error: release assets do not match required set" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Mirror release tag to GitVerse
        env:
          GITVERSE_MIRROR_TOKEN: ${{ secrets.GITVERSE_MIRROR_TOKEN }}
          GITVERSE_FALLBACK_TOKEN: ${{ secrets.CHIMERA_GITVERS_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mirror_token="${GITVERSE_MIRROR_TOKEN:-${GITVERSE_FALLBACK_TOKEN:-}}"
          if [[ -z "${mirror_token:-}" ]]; then
            echo "error: GITVERSE_MIRROR_TOKEN (or CHIMERA_GITVERS_TOKEN) secret is required for GitVerse mirror" >&2
            exit 1
          fi
          git remote add gitverse "https://oauth2:${mirror_token}@gitverse.ru/ArtReg/chimera.git"
          git push gitverse main:main "${RELEASE_TAG}" --tags
